<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Atlas — cannot reach the server</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #101827;
        color: #e8ecf5;
        font:
          16px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        max-width: 32rem;
        padding: 2rem;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
      }
      h1 {
        font-size: 1.4rem;
        margin: 1rem 0 0.5rem;
      }
      p {
        color: #b9c2d6;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.6rem 1.2rem;
        border-radius: 10px;
        background: #8f86ff;
        color: #101827;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/atlas-icon.svg" alt="" />
      <h1>Atlas can’t reach its server</h1>
      <p>
        Your workspace data lives on the Atlas server, so nothing can be shown or saved while it is unreachable. Check
        that the server is running and that you are connected to the network, then try again.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
